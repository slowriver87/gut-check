<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gut Check</title>
<meta name="description" content="Games that test how good your gut is at things you never formally learned.">
<style>
/* ===== Gut Games shared look (keep identical across the set) ===== */
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#6a6e78; --line:#e4e1d8;
  --accent:#3a5bd9; --accent-ink:#ffffff; --soft:#eef1fc;
  --good:#1f8a5b; --bad:#c2453a; --warn:#b7791f;
  --dot:#1d1f24; --box:#fbfaf7; --band:#dfe6fb;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --card:#1b1d23; --ink:#eceef2; --muted:#9aa0ab; --line:#2c2f37;
    --accent:#7d97ff; --accent-ink:#0e1020; --soft:#22273a;
    --good:#4cc38a; --bad:#ff7a6e; --warn:#e3a94a;
    --dot:#eceef2; --box:#16181d; --band:#2a3354;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --card:#1b1d23; --ink:#eceef2; --muted:#9aa0ab; --line:#2c2f37;
  --accent:#7d97ff; --accent-ink:#0e1020; --soft:#22273a;
  --good:#4cc38a; --bad:#ff7a6e; --warn:#e3a94a;
  --dot:#eceef2; --box:#16181d; --band:#2a3354;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.topbar a,.linkbtn{color:var(--accent);text-decoration:none;font-size:14px;background:none;border:0;padding:6px 0;cursor:pointer;font-family:inherit}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  width:36px;height:36px;font-size:16px;cursor:pointer}
h1{font-size:30px;line-height:1.15;margin:10px 0 0;letter-spacing:-.01em}
.time{color:var(--muted);font-size:14px;margin:2px 0 10px}
.rule{font-size:17px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:14px 0}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;
  padding:15px;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big{font-size:26px;font-weight:700;line-height:1.2;margin:4px 0}
.plain{background:var(--soft);border-radius:14px;padding:14px 16px}
.plain h3,.card h3{margin:0 0 6px;font-size:16px}
.plain p{margin:8px 0}
.hidden{display:none!important}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}

/* ===== Dashboard specific ===== */
.sub{color:var(--muted);margin:2px 0 6px}
.game h2{font-size:20px;margin:0}
.game .blurb{color:var(--muted);font-size:14px;margin:2px 0 0}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.play{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;border-radius:12px;padding:9px 16px;white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;margin-top:10px}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.mid{background:var(--soft);color:var(--accent)}
.chip.low{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.none{background:var(--soft);color:var(--muted)}
.trend{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.trend svg{flex:0 0 120px}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span></span><button class="iconbtn" id="themeBtn" aria-label="Switch light or dark"></button></div>
  <h1>Gut Check</h1>
  <div class="sub">How good is your gut at things you never learned?</div>
  <div class="time" id="count"></div>

  <div class="plain" id="summary"></div>
  <div id="games"></div>

  <p class="small muted" style="margin-top:20px">Scores are saved only in this browser, on this device. Clearing your browser data erases them.</p>
</div>

<script>
(function(){
"use strict";
/* Add a game here: one line. Games found in storage but not listed here still show up. */
const GAMES = [
  { key:"gut.dotduel", title:"Dot Duel", path:"../gut-dot-duel/", roundTime:"About 2 minutes", blurb:"Which group has more dots?",
    metric:"Weber fraction", better:"lower", normLo:0.12, normHi:0.30, decimals:2, suffix:"", skill:"number sense" },
  { key:"gut.timegut", title:"Time Gut", path:"../gut-time-gut/", roundTime:"About 2 minutes", blurb:"How steady is your inner clock?",
    metric:"Timing spread", better:"lower", normLo:12, normHi:20, decimals:0, suffix:"%", skill:"inner clock" },
];
const THEME_KEY="gut.theme";

/* theme */
const root=document.documentElement;
function applyTheme(t){ if(t==="light"||t==="dark") root.setAttribute("data-theme",t); else root.removeAttribute("data-theme"); }
let theme=null; try{ theme=localStorage.getItem(THEME_KEY); }catch(e){}
applyTheme(theme);
function isDark(){ return getComputedStyle(root).getPropertyValue("--bg").trim()==="#121317"; }
function setIcon(){ document.getElementById("themeBtn").textContent = isDark() ? "☀" : "☾"; }
setIcon();
document.getElementById("themeBtn").addEventListener("click",()=>{ theme=isDark()?"light":"dark"; applyTheme(theme); setIcon();
  try{ localStorage.setItem(THEME_KEY,theme); }catch(e){} render(); });

function read(key){ try{ const d=JSON.parse(localStorage.getItem(key)); return d&&Array.isArray(d.sessions)?d:null; }catch(e){ return null; } }
function allGames(){
  const list = GAMES.map(g=>Object.assign({}, g, {data:read(g.key)}));
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || !k.startsWith("gut.") || k===THEME_KEY || list.some(g=>g.key===k)) continue;
      const d=read(k); if(!d || !d.title) continue;
      list.push({ key:k, title:d.title, path:d.path||"#", roundTime:d.roundTime||"", blurb:d.blurb||"", metric:d.metric||"Score",
        better:d.better||"lower", normLo:d.normLo, normHi:d.normHi, decimals:d.decimals??2, suffix:d.suffix||"", skill:d.title, data:d });
    }
  }catch(e){}
  return list;
}

const fmt=(g,v)=> (v==null||isNaN(v)) ? "–" : (+v).toFixed(g.decimals)+g.suffix;
function css(v){ return getComputedStyle(root).getPropertyValue(v).trim(); }

function standing(g, v){
  if(v==null || g.normLo==null || g.normHi==null) return null;
  const lowerBetter = g.better!=="higher";
  if(v>=g.normLo && v<=g.normHi) return "typical";
  const below = v<g.normLo;
  return (below===lowerBetter) ? "better" : "worse";
}
function stats(g){
  const s=g.data?g.data.sessions:[]; const n=s.length;
  if(!n) return {n:0};
  const vals=s.map(x=>+x.value);
  const latest=vals[n-1];
  const last5=vals.slice(-5), avg5=last5.reduce((a,b)=>a+b,0)/last5.length;
  const settled = g.data.settled && g.data.settled.value!=null ? +g.data.settled.value : null;
  const main = settled!=null ? settled : avg5;
  let trend=null;
  if(n>=4){
    const k=Math.min(3,Math.floor(n/2)); const a=vals.slice(-k), b=vals.slice(-2*k,-k);
    const ma=a.reduce((x,y)=>x+y,0)/k, mb=b.reduce((x,y)=>x+y,0)/k;
    const ch=(ma-mb)/mb; const lowerBetter=g.better!=="higher";
    trend = Math.abs(ch)<0.10 ? "steady" : ((ch<0)===lowerBetter ? "improving" : "slipping");
  }
  return {n, latest, avg5, settled, main, trend, vals, rounds:n};
}
function spark(g, vals){
  const v=vals.slice(-15); if(v.length<2) return "";
  const W=120,H=34,P=4; let lo=Math.min(...v), hi=Math.max(...v);
  if(g.normLo!=null){ lo=Math.min(lo,g.normLo); hi=Math.max(hi,g.normHi); }
  if(hi===lo) hi=lo+1;
  const lowerBetter=g.better!=="higher";
  // draw so that "better" is up
  const Y=x=> lowerBetter ? P+(x-lo)/(hi-lo)*(H-2*P) : P+(1-(x-lo)/(hi-lo))*(H-2*P);
  const X=i=>P+i/(v.length-1)*(W-2*P);
  let d=""; v.forEach((x,i)=>d+=(i?"L":"M")+X(i).toFixed(1)+","+Y(x).toFixed(1));
  const band = g.normLo!=null ? `<rect x="0" width="${W}" y="${Math.min(Y(g.normLo),Y(g.normHi))}" height="${Math.abs(Y(g.normHi)-Y(g.normLo))}" fill="${css("--band")}" opacity=".7"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" width="120" height="34" aria-hidden="true">${band}<path d="${d}" fill="none" stroke="${css("--accent")}" stroke-width="2"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="3" fill="${css("--accent")}"/></svg>`;
}
const CHIP = { better:["good","Better than typical adults"], typical:["mid","Typical adult range"], worse:["low","Below typical adults"] };
const TREND = { improving:"Getting better lately", steady:"Holding steady lately", slipping:"A bit worse lately" };

function card(g){
  const st=stats(g);
  let body;
  if(!st.n){
    body=`<div class="stats"><div class="stat"><b>–</b><span>Latest</span></div><div class="stat"><b>–</b><span>Average</span></div><div class="stat"><b>0</b><span>Rounds</span></div></div>
      <span class="chip none">Not played yet</span>`;
  } else {
    const s=standing(g, st.main), early = st.settled==null;
    const chip = s ? `<span class="chip ${CHIP[s][0]}">${CHIP[s][1]}${early?" (early read)":""}</span>` : "";
    const left = Math.max(0,5-st.n);
    body=`<div class="stats">
        <div class="stat"><b>${fmt(g,st.latest)}</b><span>Latest</span></div>
        <div class="stat"><b>${fmt(g, st.settled!=null?st.settled:st.avg5)}</b><span>${st.settled!=null?"Settled (5 rounds)":"Average so far"}</span></div>
        <div class="stat"><b>${st.n}</b><span>Rounds</span></div></div>
      ${chip}
      <div class="trend">${spark(g, st.vals)}<span>${st.trend?TREND[st.trend]:(st.n<2?"Play again to see a trend":"Trend shows after 4 rounds")}</span></div>
      <div class="foot">${g.metric}${g.better!=="higher"?", lower is better":", higher is better"}.${g.normLo!=null?` Typical adults: ${fmt(g,g.normLo)} to ${fmt(g,g.normHi)}.`:""}${left?` ${left} more round${left>1?"s":""} for a settled score.`:""}</div>`;
  }
  return `<div class="card game"><div class="ghead"><div><h2>${g.title}</h2><div class="blurb">${[g.blurb,g.roundTime].filter(Boolean).join(" &middot; ")}</div></div>
    <a class="play" href="${g.path}">Play</a></div>${body}</div>`;
}

function summary(games){
  const played=games.filter(g=>stats(g).n>0), N=games.length, p=[];
  p.push(`<h3>What this means, in plain English</h3>`);
  if(!played.length){
    p.push(`<p>You haven't played yet. Each game takes about 2 minutes and tests one gut sense against what researchers have measured in adults. Start with any game below.</p>`);
    return p.join("");
  }
  p.push(`<p>You've played ${played.length} of ${N} game${N>1?"s":""}.</p>`);
  const tally={better:0,typical:0,worse:0}; let early=0; const lines=[];
  for(const g of played){
    const st=stats(g), s=standing(g,st.main); if(st.settled==null) early++;
    if(s) tally[s]++;
    const tag = `${fmt(g,st.main)}${st.settled!=null?", settled":", early read"}`;
    if(!s) { lines.push(`<b>${g.title}:</b> ${tag}. No adult norm to compare with yet.`); continue; }
    const where = s==="better" ? "better than most adults" : s==="typical" ? "in the typical adult range" : "below the typical adult range";
    lines.push(`<b>${g.title}:</b> your ${g.skill} is ${where} (${tag}).`);
  }
  p.push(`<p>${lines.join("<br>")}</p>`);
  const parts=[]; if(tally.better) parts.push(`better than typical on ${tally.better}`); if(tally.typical) parts.push(`typical on ${tally.typical}`); if(tally.worse) parts.push(`below typical on ${tally.worse}`);
  const rated=tally.better+tally.typical+tally.worse;
  if(parts.length) p.push(`<p><b>Overall:</b> of ${rated} game${rated>1?"s":""} with adult norms, your gut is ${parts.join(", ")}.</p>`);
  if(early) p.push(`<p>${early===played.length?"All":"Some"} of these are early reads. Each game needs 5 rounds before its score settles. Single rounds swing a lot from luck.</p>`);
  if(played.length>=2) p.push(`<p>These games measure different senses. Some researchers think the brain shares one system for judging "how much" across number, time, and space. That idea is still debated, so don't treat your scores as one combined ability.</p>`);
  p.push(`<p>The adult ranges come from published studies, but those used lab screens and different setups. Treat the comparisons as rough.</p>`);
  return p.join("");
}

function render(){
  const games=allGames();
  document.getElementById("count").textContent = `${games.length} game${games.length>1?"s":""} · about ${games.length*2} minutes to play them all`;
  document.getElementById("summary").innerHTML = summary(games);
  document.getElementById("games").innerHTML = games.map(card).join("");
}
render();
window.addEventListener("pageshow", render);
window.addEventListener("storage", render);
})();
</script>
</body>
</html>
